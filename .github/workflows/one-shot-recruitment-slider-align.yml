name: One-shot Recruitment Slider Align

on:
  push:
    branches:
      - security/post-merge-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/post-merge-hardening

      - name: Update recruitment presentation data
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/wp-pages.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const page = data.pages.find((item) => item.slug === 'tuyen-dung');
          if (!page) throw new Error('Recruitment page not found.');

          const blocks = page.payload.sections
            .flatMap((section) => section.rows ?? [])
            .flatMap((row) => row.columns ?? [])
            .flatMap((column) => column.blocks ?? []);

          const stories = blocks.find((block) => block._id === '66bf4e8c9f2a4d7b8c1e4473');
          if (!stories) throw new Error('Bikesporter stories block not found.');
          stories.props.presentation = 'slider';
          stories.props.trackLayout = 'standard';
          stories.props.slideLayout = 'responsive-three';
          delete stories.props.gridLayout;

          const processHeader = blocks.find((block) => block._id === '66bf4e8c9f2a4d7b8c1e4463');
          if (!processHeader) throw new Error('Recruitment process header not found.');
          processHeader.props.align = 'center';

          page.updatedAt = '2026-08-18T11:08:00+07:00';
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE

          rm .github/workflows/one-shot-recruitment-slider-align.yml

      - name: Commit presentation migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/wp-pages.json .github/workflows/one-shot-recruitment-slider-align.yml
          git commit -m 'fix(recruitment): use testimonial slider and centered process heading'
          git push origin HEAD:security/post-merge-hardening
