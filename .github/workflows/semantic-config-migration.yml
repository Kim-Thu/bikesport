name: Semantic Config Migration

on:
  push:
    branches:
      - feat/issue-1-storefront-header
    paths:
      - "scripts/migrate-semantic-page-config.mjs"
      - ".github/workflows/semantic-config-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-1-storefront-header

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Migrate semantic page config
        run: node scripts/migrate-semantic-page-config.mjs

      - name: Commit migrated config
        run: |
          if git diff --quiet -- src/data/wp-pages.json; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/wp-pages.json
          git commit -m "refactor(config): migrate page classes to semantic presets"
          git push
