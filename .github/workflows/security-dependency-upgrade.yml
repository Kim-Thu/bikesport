name: Security dependency upgrade

on:
  push:
    branches:
      - security/post-merge-hardening

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/post-merge-hardening

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Upgrade framework dependencies
        run: |
          npm install next@16.3.1 react@latest react-dom@latest
          npm install -D eslint@latest eslint-config-next@16.3.1 @types/react@latest @types/react-dom@latest
          npm pkg set scripts.lint="eslint ."

      - name: Commit dependency upgrade
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependencies already upgraded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security(deps): upgrade Next.js security baseline"
          git push origin HEAD:security/post-merge-hardening
