name: One-shot Recruitment Benefits Process

on:
  push:
    branches:
      - security/post-merge-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/post-merge-hardening

      - name: Add recruitment benefits and process
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/wp-pages.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const page = data.pages.find((item) => item.slug === 'tuyen-dung');
          if (!page) throw new Error('Recruitment page not found.');

          const benefitsId = '66bf4e8c9f2a4d7b8c1e4450';
          const processId = '66bf4e8c9f2a4d7b8c1e4460';
          const sections = page.payload.sections.filter(
            (section) => ![benefitsId, processId].includes(section._id),
          );

          const openPositionsIndex = sections.findIndex((section) => section.name === 'Open positions');
          if (openPositionsIndex < 0) throw new Error('Open positions section not found.');

          const benefitsSection = {
            _id: benefitsId,
            name: 'Why join BikeSport',
            order: 0,
            status: 'active',
            component: 'layout',
            props: { spacing: 'comfortable' },
            rows: [
              {
                _id: '66bf4e8c9f2a4d7b8c1e4451',
                props: { layout: 'stack-responsive-wide' },
                columns: [
                  {
                    _id: '66bf4e8c9f2a4d7b8c1e4452',
                    props: { layout: 'half' },
                    blocks: [
                      {
                        _id: '66bf4e8c9f2a4d7b8c1e4453',
                        status: 'active',
                        component: 'section-header',
                        props: { title: 'Vì sao bạn nên gia nhập BikeSport?' },
                      },
                      {
                        _id: '66bf4e8c9f2a4d7b8c1e4454',
                        status: 'active',
                        component: 'icon-list',
                        props: {
                          layout: 'grid',
                          items: [
                            {
                              icon: 'payment',
                              title: 'Thu nhập cạnh tranh',
                              description: 'Lương thưởng xứng đáng với năng lực và hiệu quả công việc.',
                            },
                            {
                              icon: 'package',
                              title: 'Phúc lợi toàn diện',
                              description: 'BHXH, BHYT, du lịch, teambuilding, quà tặng và nhiều phúc lợi khác.',
                            },
                            {
                              icon: 'users',
                              title: 'Môi trường năng động',
                              description: 'Không khí trẻ trung, cởi mở, khuyến khích sáng tạo và chủ động.',
                            },
                            {
                              icon: 'values',
                              title: 'Cân bằng cuộc sống',
                              description: 'Thời gian làm việc linh hoạt, quan tâm đến sức khỏe nhân viên.',
                            },
                            {
                              icon: 'growth',
                              title: 'Đào tạo & phát triển',
                              description: 'Được hỗ trợ học tập, nâng cao kỹ năng và phát triển sự nghiệp.',
                            },
                            {
                              icon: 'target',
                              title: 'Sản phẩm truyền cảm hứng',
                              description: 'Làm việc với sản phẩm giúp nâng cao sức khỏe và kết nối cộng đồng.',
                            },
                          ],
                        },
                      },
                    ],
                  },
                  {
                    _id: '66bf4e8c9f2a4d7b8c1e4455',
                    props: { layout: 'half' },
                    blocks: [
                      {
                        _id: '66bf4e8c9f2a4d7b8c1e4456',
                        status: 'active',
                        component: 'media',
                        props: {
                          mediaId: null,
                          alt: 'Đội ngũ BikeSport',
                          aspect: 'landscape',
                        },
                      },
                    ],
                  },
                ],
              },
            ],
          };

          const processSection = {
            _id: processId,
            name: 'Recruitment process',
            order: 0,
            status: 'active',
            component: 'layout',
            props: { spacing: 'comfortable' },
            rows: [
              {
                _id: '66bf4e8c9f2a4d7b8c1e4461',
                columns: [
                  {
                    _id: '66bf4e8c9f2a4d7b8c1e4462',
                    props: { layout: 'full' },
                    blocks: [
                      {
                        _id: '66bf4e8c9f2a4d7b8c1e4463',
                        status: 'active',
                        component: 'section-header',
                        props: {
                          title: 'Quy trình tuyển dụng',
                          description: 'Quy trình rõ ràng, minh bạch để ứng viên chủ động trong từng bước.',
                        },
                      },
                      {
                        _id: '66bf4e8c9f2a4d7b8c1e4464',
                        status: 'active',
                        component: 'timeline',
                        props: {
                          items: [
                            {
                              label: 'Bước 01',
                              title: 'Gửi hồ sơ ứng tuyển',
                              description: 'Chọn vị trí phù hợp và gửi CV cùng thông tin liên hệ.',
                            },
                            {
                              label: 'Bước 02',
                              title: 'Sàng lọc hồ sơ',
                              description: 'Đội ngũ tuyển dụng đánh giá kinh nghiệm và mức độ phù hợp.',
                            },
                            {
                              label: 'Bước 03',
                              title: 'Phỏng vấn',
                              description: 'Trao đổi với HR và bộ phận chuyên môn về năng lực, công việc và kỳ vọng.',
                            },
                            {
                              label: 'Bước 04',
                              title: 'Đề nghị nhận việc',
                              description: 'Thống nhất vị trí, thu nhập, phúc lợi và thời gian bắt đầu.',
                            },
                            {
                              label: 'Bước 05',
                              title: 'Gia nhập BikeSport',
                              description: 'Hoàn tất thủ tục và bắt đầu chương trình hội nhập cùng đội ngũ.',
                            },
                          ],
                        },
                      },
                    ],
                  },
                ],
              },
            ],
          };

          sections.splice(openPositionsIndex, 0, benefitsSection, processSection);
          page.payload.sections = sections.map((section, index) => ({ ...section, order: index + 1 }));
          page.updatedAt = '2026-08-18T10:57:00+07:00';

          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE

          rm .github/workflows/one-shot-recruitment-benefits-process.yml

      - name: Commit recruitment data and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/wp-pages.json .github/workflows/one-shot-recruitment-benefits-process.yml
          git commit -m 'feat(recruitment): add benefits and hiring process'
          git push origin HEAD:security/post-merge-hardening
