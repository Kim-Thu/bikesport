name: Security ESLint pin

on:
  push:
    branches:
      - security/post-merge-hardening

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/post-merge-hardening

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Pin ESLint to supported major
        run: npm install -D eslint@9.39.5

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "ESLint already pinned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(lint): pin ESLint 9 for Next 16 plugin compatibility"
          git push origin HEAD:security/post-merge-hardening
