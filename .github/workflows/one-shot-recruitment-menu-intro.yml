name: One-shot Recruitment Menu Intro

on:
  push:
    branches:
      - security/post-merge-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/post-merge-hardening

      - name: Update recruitment navigation and intro
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          menu_path = Path('src/data/wp-menu.json')
          menu_data = json.loads(menu_path.read_text(encoding='utf-8'))
          about_menu = next(menu for menu in menu_data['menus'] if menu['name'] == 'Về BikeSport')

          about_menu['items'] = [item for item in about_menu['items'] if item.get('href') != '/tuyen-dung']
          for item in about_menu['items']:
              if item.get('order', 0) >= 4:
                  item['order'] += 1
          about_menu['items'].append({
              '_id': '66bf4e8c9f2a4d7b8c1e3515',
              'label': 'Tuyển dụng',
              'href': '/tuyen-dung',
              'parentId': None,
              'order': 4,
          })
          about_menu['items'].sort(key=lambda item: item.get('order', 0))
          about_menu['updatedAt'] = '2026-08-18T12:00:00+07:00'
          menu_path.write_text(json.dumps(menu_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pages_path = Path('src/data/wp-pages.json')
          pages_data = json.loads(pages_path.read_text(encoding='utf-8'))
          page = next(page for page in pages_data['pages'] if page.get('slug') == 'tuyen-dung')
          sections = page['payload']['sections']

          intro_id = '66bf4e8c9f2a4d7b8c1e4490'
          sections = [section for section in sections if section.get('_id') != intro_id]
          for section in sections:
              if section.get('order', 0) >= 2:
                  section['order'] += 1

          intro = {
              '_id': intro_id,
              'name': 'Recruitment introduction',
              'order': 2,
              'status': 'active',
              'component': 'layout',
              'props': {
                  'spacing': 'comfortable'
              },
              'rows': [
                  {
                      '_id': '66bf4e8c9f2a4d7b8c1e4491',
                      'columns': [
                          {
                              '_id': '66bf4e8c9f2a4d7b8c1e4492',
                              'props': {
                                  'layout': 'full'
                              },
                              'blocks': [
                                  {
                                      '_id': '66bf4e8c9f2a4d7b8c1e4493',
                                      'status': 'active',
                                      'component': 'content',
                                      'props': {
                                          'eyebrow': 'Gia nhập BikeSport',
                                          'title': 'Cùng nhau tạo nên những hành trình tốt hơn',
                                          'align': 'center',
                                          'paragraphs': [
                                              'BikeSport không chỉ xây dựng nơi làm việc cho những người yêu xe đạp. Chúng tôi tìm những người muốn học hỏi, chủ động và cùng tạo ra trải nghiệm tốt hơn cho khách hàng.',
                                              'Mỗi vị trí đều là một phần của hành trình đưa lối sống năng động đến gần hơn với cộng đồng.'
                                          ]
                                      }
                                  }
                              ]
                          }
                      ]
                  }
              ]
          }

          sections.append(intro)
          sections.sort(key=lambda section: section.get('order', 0))
          page['payload']['sections'] = sections
          page['updatedAt'] = '2026-08-18T12:00:00+07:00'
          pages_path.write_text(json.dumps(pages_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/one-shot-recruitment-menu-intro.yml

      - name: Commit recruitment navigation and intro
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/wp-menu.json src/data/wp-pages.json .github/workflows/one-shot-recruitment-menu-intro.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(recruitment): add navigation and page introduction'
          git push origin HEAD:security/post-merge-hardening
