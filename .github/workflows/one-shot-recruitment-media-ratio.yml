name: One-shot Recruitment Media Ratio

on:
  push:
    branches:
      - security/post-merge-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/post-merge-hardening

      - name: Update recruitment media aspect
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/data/wp-pages.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const page = data.pages.find((item) => item.slug === 'tuyen-dung');
          if (!page) throw new Error('Recruitment page not found.');

          const mediaBlock = page.payload.sections
            .flatMap((section) => section.rows ?? [])
            .flatMap((row) => row.columns ?? [])
            .flatMap((column) => column.blocks ?? [])
            .find((block) => block._id === '66bf4e8c9f2a4d7b8c1e4456');

          if (!mediaBlock || mediaBlock.component !== 'media') {
            throw new Error('Recruitment why-join media block not found.');
          }

          mediaBlock.props.aspect = 'video';
          page.updatedAt = '2026-08-18T11:32:00+07:00';
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE

          rm .github/workflows/one-shot-recruitment-media-ratio.yml

      - name: Commit recruitment media ratio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/wp-pages.json .github/workflows/one-shot-recruitment-media-ratio.yml
          git commit -m 'fix(recruitment): reduce why-join media ratio'
          git push origin HEAD:security/post-merge-hardening
