name: One-shot Blue Tone Migration

on:
  push:
    branches:
      - security/post-merge-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/post-merge-hardening

      - name: Replace blue-600 with blue-700 in src
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -l 'blue-600' -- src || true)
          printf 'Files containing blue-600 before migration: %s\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"

          for file in "${files[@]}"; do
            sed -i 's/blue-600/blue-700/g' "$file"
          done

          if git grep -n 'blue-600' -- src; then
            echo 'blue-600 still exists in src after migration.'
            exit 1
          fi

          rm .github/workflows/one-shot-blue-tone.yml

      - name: Commit migration and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/one-shot-blue-tone.yml
          if git diff --cached --quiet; then
            echo 'No blue-600 occurrences found; bootstrap workflow removal is the only expected change.'
          fi
          git commit -m 'style: replace blue-600 with blue-700'
          git push origin HEAD:security/post-merge-hardening
