name: MongoDB Runtime Bootstrap

on:
  push:
    branches:
      - feat/issue-1-storefront-header
    paths:
      - ".github/workflows/mongodb-runtime-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-1-storefront-header

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install MongoDB driver
        run: npm install mongodb@latest --save

      - name: Remove one-time bootstrap workflow
        run: git rm .github/workflows/mongodb-runtime-bootstrap.yml

      - name: Commit dependency and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git add -u .github/workflows/mongodb-runtime-bootstrap.yml
          git commit -m "build(mongodb): add official runtime driver"
          git push
